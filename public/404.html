<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Madi-Tota™</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so it serves this file for any
      // path it doesn't recognise (e.g. a deep link or a refresh on a React
      // Router route). This redirects back to "/" with the real path encoded
      // in the query string; index.html decodes it before the app boots.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
