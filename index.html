  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Decodes the redirect written by public/404.html, restoring the real
      // path (and any real query string, e.g. PreviewGate's ?key=) before the
      // app reads window.location. Must run before main.tsx.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
